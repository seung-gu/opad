[project]
name = "opad"
version = "0.19.0"
description = "opad using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "python-dotenv",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "pymongo>=4.6.0",
    "httpx>=0.25.0",
    "litellm>=1.50.0",
    "tenacity>=9.0.0",
    "json-repair",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "email-validator>=2.0.0",
    "stanza>=1.9.0",
]
worker = [
    "crewai[anthropic,tools]==1.15.23",
    "boto3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/crew", "server/api", "server/worker", "server/utils"]

[tool.crewai]
type = "crew"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "radon>=6.0.1",
    "ruff>=0.17.6",
]

[project.scripts]
opad = "crew.main:run"
run_crew = "crew.main:run"

[tool.ruff]
line-length = 120
src = ["server"]
extend-exclude = ["*.md"]  # leave the code blocks in the docs as written

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # the formatter wraps code; long strings and comments stay as written

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports
"server/api/main.py" = ["E402"]  # load_dotenv() and sys.path must run before the imports
"scripts/*" = ["E402"]
"client/libs/api-types/sync_from_backend.py" = ["E402"]
