name: CI

# Runs the same checks as .pre-commit-config.yaml, for commits made without the hook.
on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv run --locked --only-dev ruff check .
      - run: uv run --locked --only-dev ruff format --check .

  api-types:
    name: API types up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET_KEY: ci-only # main.py requires it at import; only used to build the spec
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      # The api extra pulls torch through stanza, which the export never imports. Slow on a cold cache.
      - run: uv sync --locked --extra api
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter .
      - run: pnpm export:openapi && pnpm generate:types
      - name: Fail if the committed files are stale
        run: |
          if ! git diff --exit-code client/libs/api-types/; then
            echo "::error::openapi.json or api.generated.ts is stale. Run: pnpm export:openapi && pnpm generate:types, then commit both."
            exit 1
          fi
