# dev로 머지된 PR의 본문에서 Closes/Fixes/Resolves #N을 찾아 그 이슈를 닫는다.
# GitHub는 기본 브랜치(main)로 머지될 때만 이걸 해 주기 때문에 dev용으로 따로 둔다.
name: Close issues on dev merge

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues named in the PR body
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # PR 본문은 누구나 쓸 수 있는 입력이라 run에 바로 넣지 않고 환경 변수로 넘긴다
          BODY: ${{ github.event.pull_request.body }}
        run: |
          numbers=$(printf '%s' "$BODY" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+' \
            | grep -oE '[0-9]+$' | sort -u || true)
          for n in $numbers; do
            gh issue close "$n" --repo "$REPO" --comment "#$PR 머지로 닫음 (dev)"
          done
